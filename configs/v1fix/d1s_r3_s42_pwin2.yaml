# P-window control at four times the weight (p = 2.0); see d1s_r3_s42_pwin.yaml.
seed: 42
scaled_derivation: true
npz: data/processed/ptbxl_medianbeat_clean_100hz.npz
leadfield_rank: 3
head_init_scale: 0.01
grad_clip: 1.0
train:
  batch_size: 128
  max_epochs: 150
  lr_encoder: 0.001
  lr_decoder_global: 0.0005
  weight_decay: 0.0001
  early_stop_patience: 20
  leadfield_warmup_epochs: 20
  amp: true
loss_weights:
  rec: 1.0
  slope: 0.2
  qrs: 1.0
  st: 0.5
  t: 0.5
  phys: 0.05
  H: 0.001
  p: 2.0
out_dir: runs/v1fix_pwin2_s42
out_theta: data/processed/ptbxl_theta_d1s_r3_s42_pwin2.npz
out_ckpt: checkpoints/d1s_r3_s42_pwin2_best.pt
