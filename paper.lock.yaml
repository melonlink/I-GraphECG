# Superseded lineages. Named so that a gate can recognise them, and so that the one
# legitimate read of a superseded weight -- W1M_scaled_derivation, which compares the
# two derivation conventions and therefore needs the pre-change model -- is a declared
# exception rather than an oversight.
superseded:
  lineages: [eikonal, eikonal_B, seed_sweep, d1s_r5, d1s_r6, d1s_r8, ranksens, limbctl, c3]
  permitted_reads:
    - script: scripts/stats/W1M_scaled_derivation.py
      artifact: checkpoints/graphmono_encoder_eikonal_B_best.pt
      sha256: cfce9fd481bdf58776fd44e0120dddde28fc7695c845f42201f48805e056bbd9
      bytes: 8867973
      reason: >-
        evidence that the scaled derivation changes training, so the comparison needs
        the pre-change lineage. A read, never a reported number.
