# The published lineage, declared once.
#
# Every fact here used to live in a filename, a module-level constant or a sentence of
# prose. Three of those spellings disagreed with each other: scripts/45 and 47 resolved
# their checkpoints to the SUPERSEDED eikonal_B line in both branches of ckpt_of(), and
# only a lambda inside 54_cd_descriptors.py -- a different file -- redirected them to the
# lineage the paper reports. The shipped default was wrong; the correct value lived in a
# monkey patch. A reader running the script directly would have computed, in silence,
# numbers from a model the paper does not use.
#
# Read through igraphecg.repro.lineage. Nothing else may name a checkpoint file.

lineage: d1s_r3
description: >-
  rank-3 lead field, scaled-space Einthoven derivation, stabilized head initialisation
  (head_init_scale 0.01, grad_clip 1.0). Five seeds; 42 is the locked model.
seeds: [42, 1, 2, 3, 4]

# sha256 is checked on first use. A file that is not the locked weight fails loudly
# instead of quietly producing different numbers.
checkpoints:
  42:
    path: checkpoints/d1s_r3_s42_best.pt
    sha256: 1957b20d69947ec8076c43086145c69b18f849313a351b14b5380a68e22eae1f
    bytes: 8868037
  1:
    path: checkpoints/d1s_r3_s1_best.pt
    sha256: c1cd241a809a053d40928ecb48c71df524786f6dea33608d94d5e9178341b54c
    bytes: 8868037
  2:
    path: checkpoints/d1s_r3_s2_best.pt
    sha256: e34a34f5e908cf31a853a1fae9b583522f96427801cd601c06e81ce13de62e9b
    bytes: 8868037
  3:
    path: checkpoints/d1s_r3_s3_best.pt
    sha256: cba5352cdfede8d2013587f485d90bb28aaf7d2eed1e53779d93ce9446c584fe
    bytes: 8868037
  4:
    path: checkpoints/d1s_r3_s4_best.pt
    sha256: f28b0b3fff15057acdf45a742870ec596e2de79da25e5ea4b834b2e3af7090bf
    bytes: 8868037

# Run directories of the published lineage, output-root relative, each with the files it
# holds. Keyed, so that a directory belongs to the lineage by declaration rather than by
# whether its name happens to match a pattern -- which is how the pre-v1fix phase1 runs
# and the rank 5/6/8 sweeps kept being mistaken for published ones.
#
# The file lists are the deposit: build_archive.py copies exactly these into
# outputs/<dir>/ of the archive, so every shipped script finds its inputs at the same
# output-root-relative path in both trees, and tests/test_output_registry.py checks the
# lists against the tree it runs in. Before this, `files:` was a count of CSVs and the
# archive shipped 6 of these 33 directories, under a results/ layout nothing read.
